<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bench — scrolling text</title>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; height: 100%; cursor: none; }
  #col { font: 28px/1.5 Georgia, 'Times New Roman', serif; color: #111; column-count: 3;
         column-gap: 48px; padding: 24px 48px; will-change: transform; }
</style>
</head>
<body>
<div id="col"></div>
<script>
// The opposite pole from the game clip: sharp, high-contrast edges moving at a
// constant speed. It is the content where a slower encoder preset visibly buys
// quality (+5 of QP at P1 against P4), which the game clip does not show at
// all — so the pair together says whether a finding is about the encoder or
// about the footage.
//
// One frame per refresh, driven by requestAnimationFrame, so the host has
// something new to encode on every single vsync: this is the content that
// makes a display run at its full refresh rate.
const col = document.getElementById("col");
const words = ("the quick brown fox jumps over the lazy dog while distant thunder rolls across " +
  "an empty plain and the lantern gutters in a wind that smells of rain and iron ").split(" ");
let text = "";
for (let i = 0; i < 4000; i++) text += words[i % words.length] + " ";
col.textContent = text;

const params = new URLSearchParams(location.search);
const speed = Number(params.get("px") ?? 600); // px/s

// ?band=1: this frame's number, coded in a band at the top-left corner and
// another at the bottom-left, so the host can tell which frame it read and
// whether both ends of it come from the same one (mw-d3d12-lab tear). 24 bits,
// an 8x8 block each, white for 1; the 8 rows below hold the complement, so a
// block caught half-written reads as invalid instead of as a wrong bit. Drawn
// in DEVICE pixels whatever the display's scale: 192x16 of them, at x = 0,
// y = 0 and y = height - 16.
const bands = [];
if (params.get("band") === "1") {
  const dpr = window.devicePixelRatio || 1;
  for (const edge of ["top", "bottom"]) {
    const c = document.createElement("canvas");
    c.width = 192;
    c.height = 16;
    c.style.cssText = "position:fixed;left:0;" + edge + ":0;z-index:10;image-rendering:pixelated;" +
      "width:" + 192 / dpr + "px;height:" + 16 / dpr + "px";
    document.body.appendChild(c);
    bands.push(c.getContext("2d"));
  }
}
let counter = 0;
function drawBands() {
  counter = (counter + 1) & 0xffffff;
  for (const g of bands) {
    for (let bit = 0; bit < 24; bit++) {
      const one = (counter >> bit) & 1;
      g.fillStyle = one ? "#fff" : "#000";
      g.fillRect(bit * 8, 0, 8, 8);
      g.fillStyle = one ? "#000" : "#fff";
      g.fillRect(bit * 8, 8, 8, 8);
    }
  }
}

let y = 0, last = 0;
function frame(t) {
  if (last) y = (y + speed * (t - last) / 1000) % (col.scrollHeight || 1);
  last = t;
  col.style.transform = "translateY(" + (-y) + "px)";
  if (bands.length) drawBands();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script src="escape.js"></script>
</body>
</html>
