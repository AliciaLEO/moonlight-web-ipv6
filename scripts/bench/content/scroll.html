<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bench — scrolling text</title>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; height: 100%; cursor: none; }
  #col { font: 28px/1.5 Georgia, 'Times New Roman', serif; color: #111; column-count: 3;
         column-gap: 48px; padding: 24px 48px; will-change: transform; }
</style>
</head>
<body>
<div id="col"></div>
<script>
// The opposite pole from the game clip: sharp, high-contrast edges moving at a
// constant speed. It is the content where a slower encoder preset visibly buys
// quality (+5 of QP at P1 against P4), which the game clip does not show at
// all — so the pair together says whether a finding is about the encoder or
// about the footage.
//
// One frame per refresh, driven by requestAnimationFrame, so the host has
// something new to encode on every single vsync: this is the content that
// makes a display run at its full refresh rate.
const col = document.getElementById("col");
const words = ("the quick brown fox jumps over the lazy dog while distant thunder rolls across " +
  "an empty plain and the lantern gutters in a wind that smells of rain and iron ").split(" ");
let text = "";
for (let i = 0; i < 4000; i++) text += words[i % words.length] + " ";
col.textContent = text;

const params = new URLSearchParams(location.search);
const speed = Number(params.get("px") ?? 600); // px/s
// ?pause=<s>: scroll for <s> seconds, stand still for <s>, and again. A still
// page is refined to its sharpest by the host; the scroll that follows is
// the picture a rate control deciding frame by frame gets wrong first (G3).
const pause = Number(params.get("pause") ?? 0);
// ?fps=<lo>-<hi> (or one number): a game's rate. The page changes only at
// frames that far apart, each interval drawn at random between the two — 49-53
// is a game that cannot hold 60 on a 60 Hz screen, 75-83 one above it (plan
// framerate-hote §13, Bruno's cases). The host's display then presents at the
// game's rate, each frame on the next of its own refreshes. The scroll keeps
// its speed: a frame moves the text by the time since the last one.
const fpsRange = (params.get("fps") || "").split("-").map(Number).filter((v) => v > 0);
let nextFrameAt = 0;
function gameInterval() {
  const lo = fpsRange[0], hi = fpsRange[1] ?? fpsRange[0];
  return 1000 / (lo + Math.random() * (hi - lo));
}

// ?band=1: this frame's number, coded in a band at the top-left corner and
// another at the bottom-left, so the host can tell which frame it read and
// whether both ends of it come from the same one (mw-d3d12-lab tear). 24 bits,
// an 8x8 block each, white for 1; the 8 rows below hold the complement, so a
// block caught half-written reads as invalid instead of as a wrong bit. Drawn
// in DEVICE pixels whatever the display's scale: 192x16 of them, at x = 0,
// y = 0 and y = height - 16.
const bands = [];
if (params.get("band") === "1") {
  const dpr = window.devicePixelRatio || 1;
  for (const edge of ["top", "bottom"]) {
    const c = document.createElement("canvas");
    c.width = 192;
    c.height = 16;
    c.style.cssText = "position:fixed;left:0;" + edge + ":0;z-index:10;image-rendering:pixelated;" +
      "width:" + 192 / dpr + "px;height:" + 16 / dpr + "px";
    document.body.appendChild(c);
    bands.push(c.getContext("2d"));
  }
}
let counter = 0;
function drawBands() {
  counter = (counter + 1) & 0xffffff;
  for (const g of bands) {
    for (let bit = 0; bit < 24; bit++) {
      const one = (counter >> bit) & 1;
      g.fillStyle = one ? "#fff" : "#000";
      g.fillRect(bit * 8, 0, 8, 8);
      g.fillStyle = one ? "#000" : "#fff";
      g.fillRect(bit * 8, 8, 8, 8);
    }
  }
}

// ?band=time: the host's steady clock at this frame, for the client's
// content-age probe (frontend/js/stream/ContentAgeProbe.js, plan
// framerate-hote). 40 blocks, each a hundredth of the screen's width, from the
// top-left corner: 32 bits of the clock in units of 10 µs, least significant
// first, then 8 of check — the sum of the value's four bytes, xor 0xA5. White
// is 1; the row under it holds the complement. Sized on the width so the
// client finds the same blocks at whatever scale it decodes; block edges fall
// on round(i × W / 100) device pixels, exactly where it looks for them.
//
// Nothing is drawn until the bench driver has told the page where the host's
// clock stands against performance.now() — mwBand.calibrate(offsetMs), over
// CDP (scripts/bench/content-age/age.py): an uncalibrated band would be read
// as a wrong age rather than as none.
const timeBand = params.get("band") === "time";
let bandOffsetMs = null;
let timeCtx = null, bandW = 0;
if (timeBand) {
  const dpr = window.devicePixelRatio || 1;
  bandW = Math.round(window.innerWidth * dpr);
  const c = document.createElement("canvas");
  c.width = Math.round(40 * bandW / 100);
  c.height = Math.round(2 * bandW / 100);
  c.style.cssText = "position:fixed;left:0;top:0;z-index:10;image-rendering:pixelated;" +
    "display:none;width:" + c.width / dpr + "px;height:" + c.height / dpr + "px";
  document.body.appendChild(c);
  timeCtx = c.getContext("2d");
  window.mwBand = {
    calibrate(offsetMs) {
      bandOffsetMs = offsetMs;
      c.style.display = "block";
      return "band calibrated: " + bandW + " px wide, offset " + offsetMs.toFixed(3) + " ms";
    },
    width: bandW,
  };
}
function bandCheck(v) {
  return (((v & 255) + ((v >>> 8) & 255) + ((v >>> 16) & 255) + (v >>> 24)) ^ 0xa5) & 255;
}
function drawTimeBand(t) {
  if (bandOffsetMs === null) return;
  const units = Math.floor((t + bandOffsetMs) * 100) % 4294967296;
  const check = bandCheck(units);
  const r1 = Math.round(bandW / 100), r2 = Math.round(2 * bandW / 100);
  for (let bit = 0; bit < 40; bit++) {
    const one = bit < 32 ? Math.floor(units / 2 ** bit) % 2 === 1 : ((check >> (bit - 32)) & 1) === 1;
    const x0 = Math.round(bit * bandW / 100), x1 = Math.round((bit + 1) * bandW / 100);
    timeCtx.fillStyle = one ? "#fff" : "#000";
    timeCtx.fillRect(x0, 0, x1 - x0, r1);
    timeCtx.fillStyle = one ? "#000" : "#fff";
    timeCtx.fillRect(x0, r1, x1 - x0, r2 - r1);
  }
}

let y = 0, last = 0;
function frame(t) {
  if (fpsRange.length) {
    if (t < nextFrameAt) {
      requestAnimationFrame(frame);
      return;
    }
    // On the game's own clock, unless the page was held back (a hidden tab).
    nextFrameAt = (nextFrameAt && t - nextFrameAt < 100 ? nextFrameAt : t) + gameInterval();
  }
  const moving = !(pause > 0) || Math.floor(t / 1000 / pause) % 2 === 0;
  if (last && moving) y = (y + speed * (t - last) / 1000) % (col.scrollHeight || 1);
  last = t;
  col.style.transform = "translateY(" + (-y) + "px)";
  if (bands.length) drawBands();
  if (timeBand) drawTimeBand(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script src="escape.js"></script>
</body>
</html>
