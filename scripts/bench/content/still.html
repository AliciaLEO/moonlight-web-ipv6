<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bench — still</title>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; height: 100%; cursor: none; }
  #col { font: 28px/1.5 Georgia, 'Times New Roman', serif; color: #111; column-count: 3;
         column-gap: 48px; padding: 24px 48px; }
</style>
</head>
<body>
<div id="col"></div>
<script>
// The same page as scroll.html with nothing moving. Two things only this
// content shows: the first keyframe and the refinement burst that follows it,
// and what a host does when there is no damage at all — which is where a
// click-to-photon distribution goes bimodal, the flag falling either side of
// the next capture deadline. A campaign that only ever measures motion never
// sees either.
const col = document.getElementById("col");
const words = ("the quick brown fox jumps over the lazy dog while distant thunder rolls across " +
  "an empty plain and the lantern gutters in a wind that smells of rain and iron ").split(" ");
let text = "";
for (let i = 0; i < 4000; i++) text += words[i % words.length] + " ";
col.textContent = text;

// ?anim=1: a calm desktop is rarely motionless — a clock ticks, a cursor
// blinks, a download bar creeps. One small square turning on every refresh
// is that: a damage rectangle on every vsync but almost nothing to encode.
// It is the content where a constant-bitrate encoder gives itself away,
// filling its budget with refinement of a picture that has not changed.
if (new URLSearchParams(location.search).get("anim")) {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;right:96px;bottom:96px;width:48px;height:48px;" +
                      "background:#c22;will-change:transform";
  document.body.appendChild(box);
  (function spin(t) {
    box.style.transform = "rotate(" + ((t / 1000 * 180) % 360) + "deg)";
    requestAnimationFrame(spin);
  })(0);
}

// ?cursor=1: the pointer shown, for a bench that moves it over the still page.
// The host draws it into the picture, so every move is a new picture with no
// present behind it: the held desktop converted again, pointer on top.
if (new URLSearchParams(location.search).get("cursor")) {
  document.documentElement.style.cursor = document.body.style.cursor = "default";
}
</script>
<script src="escape.js"></script>
</body>
</html>
